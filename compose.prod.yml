# Production stack — builds the image locally against the prod database.
# Self-contained: `.env.prod` is the single source of config (gitignored).
#   docker compose -f compose.prod.yml up -d --build
name: telegrind

services:
  postgres:
    image: postgres:15
    env_file:
      - .env.prod
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  bot:
    image: telegrind-bot:local
    build: .
    env_file:
      - .env.prod
    volumes:
      - .:/app/local
    depends_on:
      - postgres
    restart: unless-stopped

volumes:
  pgdata:
