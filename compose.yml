name: telegrind-dev

services:
  postgres:
    image: postgres:15
    ports:
      - "5433:5432"
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  bot:
    image: telegrind-bot:dev
    build: .
    env_file:
      - .env
    environment:
      # .env carries the HOST url (localhost:5433) so alembic and pytest work
      # from a shell. Inside the container postgres is a service name.
      DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD}@postgres/postgres
    volumes:
      - .:/app
      - /app/.venv
    depends_on:
      - postgres
    restart: unless-stopped

volumes:
  pgdata:
