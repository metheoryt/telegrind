[project]
name = "telegrind"
version = "0.1.0"
description = "Your private telemetry through telegram chat"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiogram>=3.22.0",
    "alembic>=1.13.0",
    "anthropic>=0.97.0",
    "asyncpg>=0.30.0",
    "psycopg[binary]>=3.1.0",
    "dateparser>=1.2.2",
    "gspread-asyncio>=2.0.0",
    "pycountry>=24.6.1",
    "pydantic-extra-types>=2.10.6",
    "python-dotenv>=1.1.1",
    "sqlalchemy[asyncio]>=2.0.44",
]

[dependency-groups]
dev = [
    "ipykernel>=7.0.1",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pyyaml>=6.0",
    "ruff>=0.14.8",
]

# Ruff configuration
[tool.ruff]
# Set the maximum line length to match Black's default
line-length = 88

# Assume Python 3.14+
target-version = "py314"

# Enable specific rule sets
lint.select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "S",   # flake8-bandit (security)
    "T20", # flake8-print
    "SIM", # flake8-simplify
    "RUF", # Ruff-specific rules
    "ANN", # flake8-annotations (feeds gortex's type-aware resolver)
]

# Ignore specific rules if needed
# https://docs.astral.sh/ruff/linter/#error-suppression
lint.ignore = [
    "S101",   # Use of assert (common in tests)
    "ANN401", # allow explicit Any where deliberate
    "RUF001", # Cyrillic is the app's language, not an ambiguous glyph
    "RUF002", # ditto, in docstrings
    "RUF003", # ditto, in comments
]

# Directories to exclude from linting
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
]

# Configure the formatter
[tool.ruff.format]
# Use double quotes for strings
quote-style = "double"

# Indent with spaces
indent-style = "space"

# Respect magic trailing commas
skip-magic-trailing-comma = false

# Automatically detect line ending
line-ending = "auto"

# Configure import sorting
[tool.ruff.lint.isort]
known-first-party = ["telegrind"]

[tool.ty.environment]
python-version = "3.14"
python = "./.venv"
root = ["."]

[tool.ty.src]
include = ["telegrind", "main.py"]
exclude = ["**/__pycache__", "alembic/versions", "build", "dist"]
respect-ignore-files = true

[tool.ty.terminal]
error-on-warning = false

# [tool.ty.rules]  — promote to "error" as gaps are paid down, e.g.
# unresolved-import = "error"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["llm: hits the Anthropic API; costs tokens; opt in with -m llm"]
addopts = "-m 'not llm'"
